name: Terraform plan and apply

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment:
        description: Versioned environment configuration under terraform/environments
        required: true
        default: phase1
        type: string
      stack:
        description: Terraform root to operate
        required: true
        type: choice
        options:
          - aws-infra
          - aws-addons
          - gcp-cicd
          - gcp-dr
          - gcp-addons
          - dr-data
      action:
        description: Plan, apply, or destroy through one reviewed saved plan
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  # Serialize every state-changing stack in one deployment. This prevents an
  # operator from applying aws-infra and its dependent aws-addons concurrently.
  group: terraform-${{ github.event_name == 'workflow_dispatch' && inputs.deployment || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      deployments: ${{ steps.deployments.outputs.deployments }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- terraform .github/workflows/terraform.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deployments
        name: Discover versioned Terraform environments
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t names < <(find terraform/environments -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          [[ "${#names[@]}" -gt 0 ]] || { echo "No Terraform environment directories found"; exit 1; }
          json=$(printf '%s\n' "${names[@]}" | jq -R . | jq -cs .)
          echo "deployments=$json" >> "$GITHUB_OUTPUT"

  static-checks:
    name: Format and validate / ${{ matrix.stack }}
    needs: terraform-changes
    if: github.event_name == 'workflow_dispatch' || needs.terraform-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws-infra, aws-addons, gcp-cicd, gcp-dr, gcp-addons, dr-data]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=terraform/${{ matrix.stack }} fmt -check -recursive
      - name: Initialize without remote state
        run: terraform -chdir=terraform/${{ matrix.stack }} init -backend=false
      - name: Validate
        run: terraform -chdir=terraform/${{ matrix.stack }} validate

      - name: Validate environment state and name isolation
        if: matrix.stack == 'aws-infra'
        run: python scripts/validate-environment-contract.py

  pull-request-plan:
    name: PR plan / ${{ matrix.deployment }} / ${{ matrix.stack }}
    if: github.event_name == 'pull_request' && needs.terraform-changes.outputs.changed == 'true'
    needs: [terraform-changes, static-checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws-infra, aws-addons, gcp-cicd, gcp-dr, gcp-addons, dr-data]
        deployment: ${{ fromJSON(needs.terraform-changes.outputs.deployments) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Configure AWS credentials through GitHub OIDC
        if: startsWith(matrix.stack, 'aws-') || matrix.stack == 'dr-data'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud through WIF
        if: startsWith(matrix.stack, 'gcp-') || matrix.stack == 'dr-data'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: startsWith(matrix.stack, 'gcp-') || matrix.stack == 'dr-data'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify environment files
        shell: bash
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          STACK: ${{ matrix.stack }}
        run: |
          test -f "terraform/environments/${DEPLOYMENT}/backend/${STACK}.hcl"
          test -f "terraform/environments/${DEPLOYMENT}/${STACK}.tfvars"

      - name: Check current CSP version and quota compatibility
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          STACK: ${{ matrix.stack }}
        run: bash scripts/preflight-platform-compatibility.sh "$STACK" "terraform/environments/${DEPLOYMENT}/${STACK}.tfvars"

      - name: Initialize selected stack
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          STACK: ${{ matrix.stack }}
        run: terraform -chdir=terraform/${STACK} init -reconfigure -backend-config="${GITHUB_WORKSPACE}/terraform/environments/${DEPLOYMENT}/backend/${STACK}.hcl"

      - name: Check live prerequisite for cluster add-on plan
        id: prerequisite
        shell: bash
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          STACK: ${{ matrix.stack }}
        run: |
          set -Eeuo pipefail
          ready=true
          if [[ "$STACK" == "aws-addons" ]]; then
            source_vars="terraform/environments/${DEPLOYMENT}/aws-infra.tfvars"
            cluster=$(sed -nE 's/^[[:space:]]*cluster_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$source_vars" | head -n 1)
            region=$(sed -nE 's/^[[:space:]]*aws_region[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$source_vars" | head -n 1)
            if ! aws eks describe-cluster --name "$cluster" --region "$region" >/dev/null 2>&1; then
              ready=false
              echo "aws-addons plan deferred: prerequisite EKS $cluster is absent; apply aws-infra first" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$STACK" == "gcp-addons" ]]; then
            source_vars="terraform/environments/${DEPLOYMENT}/gcp-dr.tfvars"
            cluster=$(sed -nE 's/^[[:space:]]*cluster_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$source_vars" | head -n 1)
            region=$(sed -nE 's/^[[:space:]]*region[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$source_vars" | head -n 1)
            project=$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$source_vars" | head -n 1)
            if ! gcloud container clusters describe "$cluster" --region "$region" --project "$project" >/dev/null 2>&1; then
              ready=false
              echo "gcp-addons plan deferred: prerequisite GKE $cluster is absent; apply gcp-dr first" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Create speculative plan
        if: steps.prerequisite.outputs.ready == 'true'
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          STACK: ${{ matrix.stack }}
        run: terraform -chdir=terraform/${STACK} plan -lock=false -lock-timeout=5m -var-file="${GITHUB_WORKSPACE}/terraform/environments/${DEPLOYMENT}/${STACK}.tfvars"

  dispatch-plan:
    name: ${{ inputs.deployment }} / ${{ inputs.stack }} / saved plan
    if: github.event_name == 'workflow_dispatch'
    needs: [terraform-changes, static-checks]
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.plan-metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Validate deployment name and files
        shell: bash
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          STACK: ${{ inputs.stack }}
        run: |
          [[ "$DEPLOYMENT" =~ ^[a-z0-9][a-z0-9-]{0,30}$ ]] || { echo "Invalid deployment name: $DEPLOYMENT"; exit 1; }
          test -f "terraform/environments/${DEPLOYMENT}/backend/${STACK}.hcl"
          test -f "terraform/environments/${DEPLOYMENT}/${STACK}.tfvars"

      - name: Configure AWS credentials through GitHub OIDC
        if: startsWith(inputs.stack, 'aws-') || inputs.stack == 'dr-data'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud through WIF
        if: startsWith(inputs.stack, 'gcp-') || inputs.stack == 'dr-data'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: startsWith(inputs.stack, 'gcp-') || inputs.stack == 'dr-data'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Initialize selected stack
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          STACK: ${{ inputs.stack }}
        run: terraform -chdir=terraform/${STACK} init -reconfigure -backend-config="${GITHUB_WORKSPACE}/terraform/environments/${DEPLOYMENT}/backend/${STACK}.hcl"

      - name: Check current CSP version and quota compatibility
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          STACK: ${{ inputs.stack }}
        run: bash scripts/preflight-platform-compatibility.sh "$STACK" "terraform/environments/${DEPLOYMENT}/${STACK}.tfvars"

      - name: Create saved plan
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          DEPLOYMENT: ${{ inputs.deployment }}
          STACK: ${{ inputs.stack }}
        run: |
          set -Eeuo pipefail
          mode=()
          [[ "$ACTION" == "destroy" ]] && mode=(-destroy)
          terraform -chdir=terraform/${STACK} plan "${mode[@]}" -lock-timeout=5m \
            -var-file="${GITHUB_WORKSPACE}/terraform/environments/${DEPLOYMENT}/${STACK}.tfvars" \
            -out=tfplan

      - name: Show saved plan for reviewer
        env:
          STACK: ${{ inputs.stack }}
        run: terraform -chdir=terraform/${STACK} show -no-color tfplan

      - name: Set immutable plan artifact name
        id: plan-metadata
        shell: bash
        run: echo "artifact_name=tfplan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload saved plan
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.plan-metadata.outputs.artifact_name }}
          path: terraform/${{ inputs.stack }}/tfplan
          if-no-files-found: error
          retention-days: 1

  approved-apply:
    name: ${{ inputs.deployment }} / ${{ inputs.stack }} / approved exact apply
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')
    needs: dispatch-plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment == 'phase1' && 'infrastructure-production' || format('infrastructure-{0}', inputs.deployment) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Verify approved commit is still current
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure AWS credentials through GitHub OIDC
        if: startsWith(inputs.stack, 'aws-') || inputs.stack == 'dr-data'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud through WIF
        if: startsWith(inputs.stack, 'gcp-') || inputs.stack == 'dr-data'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Initialize the exact backend
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          STACK: ${{ inputs.stack }}
        run: terraform -chdir=terraform/${STACK} init -reconfigure -backend-config="${GITHUB_WORKSPACE}/terraform/environments/${DEPLOYMENT}/backend/${STACK}.hcl"

      - name: Download the reviewed plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.dispatch-plan.outputs.artifact_name }}
          path: terraform/${{ inputs.stack }}

      - name: Apply only the reviewed plan
        env:
          STACK: ${{ inputs.stack }}
        run: terraform -chdir=terraform/${STACK} apply -lock-timeout=5m -auto-approve tfplan

      - name: Prove convergence after the approved operation
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          DEPLOYMENT: ${{ inputs.deployment }}
          STACK: ${{ inputs.stack }}
        run: |
          set -Eeuo pipefail
          mode=()
          [[ "$ACTION" == "destroy" ]] && mode=(-destroy)
          set +e
          terraform -chdir=terraform/${STACK} plan "${mode[@]}" -detailed-exitcode \
            -lock-timeout=5m \
            -var-file="${GITHUB_WORKSPACE}/terraform/environments/${DEPLOYMENT}/${STACK}.tfvars"
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            echo "Convergence verified: repeated ${ACTION} plan has no changes" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$result" -eq 2 ]]; then
            echo "The approved operation completed but a repeated ${ACTION} plan still has changes" >&2
            exit 1
          else
            echo "Convergence verification failed before a trustworthy result was produced" >&2
            exit "$result"
          fi

  terraform-required-gate:
    name: Terraform required gate
    if: always()
    needs: [terraform-changes, static-checks, pull-request-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Terraform checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TERRAFORM_CHANGED: ${{ needs.terraform-changes.outputs.changed }}
          CHANGE_DETECTOR_RESULT: ${{ needs.terraform-changes.result }}
          STATIC_CHECK_RESULT: ${{ needs.static-checks.result }}
          PR_PLAN_RESULT: ${{ needs.pull-request-plan.result }}
        run: |
          [[ "$CHANGE_DETECTOR_RESULT" == "success" ]] || { echo "Terraform change detection failed"; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" && "$TERRAFORM_CHANGED" != "true" ]]; then
            echo "No Terraform changes; required gate passed"
            exit 0
          fi
          [[ "$STATIC_CHECK_RESULT" == "success" ]] || { echo "Terraform format or validation failed"; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_PLAN_RESULT" == "success" ]] || { echo "One or more Terraform plans failed"; exit 1; }
          fi
          echo "Terraform required gate passed"
