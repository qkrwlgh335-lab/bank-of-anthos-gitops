name: DR failover to GCP

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Isolated deployment name
        required: true
        default: phase1
        type: string
      name_prefix:
        description: Environment-unique resource and secret prefix
        required: true
        default: phase1-bank
        type: string
      gcp_project_id:
        description: Approved GCP project for this deployment
        required: true
        default: kdt4-1-506106
        type: string
      gcp_region:
        description: GCP region for this deployment
        required: true
        default: asia-northeast3
        type: string
      gcp_wif_provider:
        description: Optional WIF provider override; otherwise use repository variable
        required: false
        type: string
      gcp_dr_service_account:
        description: Optional DR service-account override; otherwise use repository variable
        required: false
        type: string
      gke_cluster:
        description: Optional GKE cluster override
        required: false
        type: string
      gke_node_pool:
        description: Optional GKE node-pool override
        required: false
        type: string
      db_bootstrap_ready:
        description: Confirm this deployment completed DB bootstrap; failover still performs live DMS/Cloud SQL checks
        required: true
        default: false
        type: boolean
      mode:
        description: Preflight checks readiness; platform-drill tests approved GKE activation without DB/DNS
        required: true
        default: platform-preflight
        type: choice
        options: [platform-preflight, platform-drill, data-preflight, failover]
      incident_id:
        description: Incident/change ticket recorded in the deployment audit
        required: true
        type: string
      image_tag:
        description: Failover GAR tag (sha- plus 40-character SHA); optional for preflight
        required: false
        type: string
      confirmation:
        description: Enter DRILL-GCP-NO-DB for platform-drill or PROMOTE-GCP for failover
        required: false
        type: string
      rpo_acknowledgement:
        description: For failover only, enter ACCEPT-LAST-REPLICATED-DATA
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ inputs.deployment }}-gcp-dr-failover
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
  GCP_REGION: ${{ inputs.gcp_region }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'bank-of-anthos' }}
  GCP_WIF_PROVIDER: ${{ inputs.gcp_wif_provider || vars.GCP_WIF_PROVIDER }}
  GCP_DR_SERVICE_ACCOUNT: ${{ inputs.gcp_dr_service_account || vars.GCP_DR_SERVICE_ACCOUNT }}
  GKE_CLUSTER: ${{ inputs.gke_cluster || vars.GKE_CLUSTER || format('{0}-gke', inputs.name_prefix) }}
  GKE_NODE_POOL: ${{ inputs.gke_node_pool || vars.GKE_NODE_POOL || 'pilot-light' }}
  GKE_PILOT_LIGHT_NODES: ${{ vars.GKE_PILOT_LIGHT_NODES || '1' }}
  GKE_FAILOVER_NODES: ${{ vars.GKE_FAILOVER_NODES || '3' }}
  GCP_SECRET_PREFIX: ${{ vars.GCP_SECRET_PREFIX || inputs.name_prefix }}
  DR_DB_BOOTSTRAP_READY: ${{ inputs.db_bootstrap_ready }}
  MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB || format('{0}-rds-to-cloudsql', inputs.name_prefix) }}
  CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE || format('{0}-dr-postgres', inputs.name_prefix) }}

jobs:
  validate-input:
    name: Validate request and safety lock
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable tag and explicit confirmations
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          NAME_PREFIX: ${{ inputs.name_prefix }}
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.image_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RPO_ACKNOWLEDGEMENT: ${{ inputs.rpo_acknowledgement }}
          DB_BOOTSTRAP_READY: ${{ env.DR_DB_BOOTSTRAP_READY }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOYMENT" =~ ^[a-z0-9][a-z0-9-]{0,30}$ ]] || { echo "Invalid deployment: $DEPLOYMENT"; exit 1; }
          [[ "$NAME_PREFIX" =~ ^[a-z0-9][a-z0-9-]{0,40}$ ]] || { echo "Invalid name_prefix: $NAME_PREFIX"; exit 1; }
          [[ -n "$GCP_WIF_PROVIDER" && -n "$GCP_DR_SERVICE_ACCOUNT" ]] || {
            echo "Set gcp_wif_provider and gcp_dr_service_account inputs or repository variables"; exit 1;
          }
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^sha-[0-9a-f]{40}$ ]] || { echo "Invalid immutable tag"; exit 1; }
          fi
          if [[ "$MODE" == "failover" && -z "$TAG" ]]; then
            echo "Failover requires one immutable tag already present for all six GAR images"
            exit 1
          fi
          if [[ "$MODE" == "platform-drill" && -z "$TAG" ]]; then
            echo "Platform drill requires one immutable tag already present for all six GAR images"
            exit 1
          fi
          if [[ "$MODE" == "platform-drill" && "$CONFIRMATION" != "DRILL-GCP-NO-DB" ]]; then
            echo "Platform drill requires exact DRILL-GCP-NO-DB confirmation"
            exit 1
          fi
          if [[ "$MODE" == "failover" && "$CONFIRMATION" != "PROMOTE-GCP" ]]; then
            echo "Failover requires exact PROMOTE-GCP confirmation"
            exit 1
          fi
          if [[ "$MODE" == "failover" && "$RPO_ACKNOWLEDGEMENT" != "ACCEPT-LAST-REPLICATED-DATA" ]]; then
            echo "Failover requires explicit RPO acknowledgement"
            exit 1
          fi
          if [[ "$MODE" == "failover" && "$DB_BOOTSTRAP_READY" != "true" ]]; then
            echo "DR_DB_BOOTSTRAP_READY is false: no certified Cloud SQL writer, grants, or runtime secrets"
            exit 1
          fi

  platform-preflight:
    name: GKE pilot-light and artifact preflight
    needs: validate-input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DR_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify GKE, Argo CD, External Secrets, and immutable GAR images
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          status=$(gcloud container clusters describe "$GKE_CLUSTER" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status)')
          [[ "$status" == "RUNNING" ]] || { echo "GKE is not RUNNING"; exit 1; }

          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=3m
          kubectl -n argocd rollout status deployment/argocd-server --timeout=3m
          kubectl -n external-secrets rollout status deployment/external-secrets --timeout=3m
          kubectl -n argocd get application bank-of-anthos-gcp-dr

          sync=$(kubectl -n argocd get application bank-of-anthos-gcp-dr -o jsonpath='{.status.sync.status}')
          health=$(kubectl -n argocd get application bank-of-anthos-gcp-dr -o jsonpath='{.status.health.status}')
          [[ "$sync" == "Synced" && "$health" == "Healthy" ]] || { echo "GCP Argo application is $sync/$health"; exit 1; }

          replicas=$(kubectl -n bank-dr get deployment -l application=bank-of-anthos -o jsonpath='{range .items[*]}{.metadata.name}={.spec.replicas}{"\n"}{end}')
          echo "$replicas"
          if echo "$replicas" | grep -Eq '=[1-9][0-9]*$'; then
            echo "Pilot-light safety check failed: a business deployment is active"
            exit 1
          fi

          for secret in "$GCP_SECRET_PREFIX-app-runtime" "$GCP_SECRET_PREFIX-app-jwt"; do
            gcloud secrets versions describe latest --secret "$secret" --project "$GCP_PROJECT_ID" --format='value(state)' | grep -qx ENABLED
          done
          kubectl -n bank-dr wait externalsecret/bank-app-runtime --for=condition=Ready --timeout=3m
          kubectl -n bank-dr wait externalsecret/bank-app-jwt --for=condition=Ready --timeout=3m

          if [[ -n "$TAG" ]]; then
            for service in frontend userservice contacts balancereader ledgerwriter transactionhistory; do
              gcloud artifacts docker images describe \
                "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$service:$TAG" \
                --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)' >/dev/null
            done
          else
            mapfile -t images < <(kubectl -n bank-dr get deployment -l application=bank-of-anthos -o jsonpath='{range .items[*]}{range .spec.template.spec.containers[*]}{.image}{"\n"}{end}{end}' | grep pkg.dev)
            for image in "${images[@]}"; do
              [[ "$image" =~ :sha-[0-9a-f]{40}$ ]] || { echo "Non-immutable GCP image: $image"; exit 1; }
              gcloud artifacts docker images describe "$image" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)' >/dev/null
            done
          fi

          {
            echo "### GCP platform preflight"
            echo "- Incident: ${{ inputs.incident_id }}"
            echo "- Mode: $MODE"
            echo "- GKE: $status"
            echo "- Argo CD: $sync / $health"
            echo "- Business replicas: zero"
            echo "- DB safety lock: $DR_DB_BOOTSTRAP_READY"
          } >> "$GITHUB_STEP_SUMMARY"

  approved-platform-drill:
    name: Approved DB-independent GCP platform drill
    if: inputs.mode == 'platform-drill'
    needs: platform-preflight
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment == 'phase1' && 'gcp-dr-approval' || format('{0}-gcp-dr-approval', inputs.deployment) }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DR_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify desired pilot-light capacity and expand the node pool
        id: capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GKE_PILOT_LIGHT_NODES" =~ ^[1-9][0-9]*$ ]] || {
            echo "GKE_PILOT_LIGHT_NODES must be a positive integer"; exit 1;
          }
          gcloud container clusters resize "$GKE_CLUSTER" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --node-pool "$GKE_NODE_POOL" \
            --num-nodes "$GKE_FAILOVER_NODES" --quiet

      - name: Activate the DB-independent image probe through GitOps
        id: activate
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin main
          python scripts/set-gcp-platform-drill.py \
            --file gitops/apps/bank-of-anthos/overlays/gcp-dr/kustomization.yaml \
            --tag "$TAG" --probe-replicas 1
          git config user.name "dr-platform-drill-bot"
          git config user.email "dr-platform-drill-bot@users.noreply.github.com"
          git add gitops/apps/bank-of-anthos/overlays/gcp-dr/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "drill: activate GCP platform probe for ${INCIDENT_ID}"
            scripts/open-auto-merge-pr.sh \
              "drill/activate-${TAG}" \
              "drill: activate GCP platform probe for ${INCIDENT_ID}" \
              "Approved platform drill. Incident/change ID: ${INCIDENT_ID}."
          else
            echo "GCP platform probe is already active for ${TAG}; continuing verification"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reconcile and verify all six release images on GKE
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.activate.outputs.revision }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          kubectl -n argocd annotate application bank-of-anthos-gcp-dr \
            argocd.argoproj.io/refresh=hard --overwrite
          for attempt in {1..60}; do
            revision=$(kubectl -n argocd get application bank-of-anthos-gcp-dr -o jsonpath='{.status.sync.revision}')
            sync=$(kubectl -n argocd get application bank-of-anthos-gcp-dr -o jsonpath='{.status.sync.status}')
            if [[ "$revision" == "$EXPECTED_REVISION" && "$sync" == "Synced" ]]; then
              break
            fi
            sleep 10
          done
          [[ "$revision" == "$EXPECTED_REVISION" && "$sync" == "Synced" ]] || {
            echo "Argo CD did not reconcile revision $EXPECTED_REVISION"; exit 1;
          }
          kubectl -n bank-dr rollout status deployment/dr-platform-probe --timeout=15m

          pod=$(kubectl -n bank-dr get pod -l app=dr-platform-probe -o jsonpath='{.items[0].metadata.name}')
          [[ -n "$pod" ]] || { echo "Platform probe pod was not created"; exit 1; }
          for container in frontend-image userservice-image contacts-image balancereader-image ledgerwriter-image transactionhistory-image; do
            exit_code=$(kubectl -n bank-dr get pod "$pod" -o \
              jsonpath="{.status.initContainerStatuses[?(@.name=='$container')].state.terminated.exitCode}")
            [[ "$exit_code" == "0" ]] || { echo "$container did not run successfully: $exit_code"; exit 1; }
          done

          active_business=$(kubectl -n bank-dr get deployment \
            -l 'application=bank-of-anthos,component!=platform-drill' \
            -o jsonpath='{range .items[*]}{.metadata.name}={.spec.replicas}{"\n"}{end}')
          echo "$active_business"
          if echo "$active_business" | grep -Eq '=[1-9][0-9]*$'; then
            echo "A DB-dependent business deployment was activated during the platform drill"
            exit 1
          fi

          {
            echo "### Approved GCP platform drill"
            echo "- Incident: ${{ inputs.incident_id }}"
            echo "- Release: $TAG"
            echo "- Environment approval: gcp-dr-approval"
            echo "- GKE node target: $GKE_FAILOVER_NODES"
            echo "- Argo CD revision: $EXPECTED_REVISION / Synced"
            echo "- Six GAR release images: pulled and executed on GKE"
            echo "- DB-dependent deployments: remained at zero"
            echo "- Cloud SQL/DMS: deliberately not accessed"
            echo "- Ingress/DNS: deliberately not created or changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pilot-light workload and capacity
        if: always() && steps.capacity.outcome == 'success'
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set +e
          failed=0
          git pull --rebase origin main || failed=1
          python scripts/set-gcp-platform-drill.py \
            --file gitops/apps/bank-of-anthos/overlays/gcp-dr/kustomization.yaml \
            --tag "$TAG" --probe-replicas 0 || failed=1
          git add gitops/apps/bank-of-anthos/overlays/gcp-dr/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "drill: restore GCP pilot-light state" || failed=1
            scripts/open-auto-merge-pr.sh \
              "drill/restore-${TAG}" \
              "drill: restore GCP pilot-light state" \
              "Automatic restoration after approved platform drill run ${GITHUB_RUN_ID}." || failed=1
          fi
          kubectl -n argocd annotate application bank-of-anthos-gcp-dr \
            argocd.argoproj.io/refresh=hard --overwrite || failed=1
          for attempt in {1..60}; do
            replicas=$(kubectl -n bank-dr get deployment dr-platform-probe -o jsonpath='{.spec.replicas}' 2>/dev/null)
            [[ "$replicas" == "0" ]] && break
            sleep 10
          done
          [[ "$replicas" == "0" ]] || failed=1
          gcloud container clusters resize "$GKE_CLUSTER" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --node-pool "$GKE_NODE_POOL" \
            --num-nodes "$GKE_PILOT_LIGHT_NODES" --quiet || failed=1
          exit "$failed"

  data-preflight:
    name: Cloud SQL and CDC preflight
    if: inputs.mode == 'data-preflight' || inputs.mode == 'failover'
    needs: platform-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DR_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify configured migration job and standby database
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          [[ -n "$MIGRATION_JOB" && -n "$CLOUD_SQL_INSTANCE" ]] || {
            echo "Set GCP_MIGRATION_JOB and GCP_CLOUD_SQL_INSTANCE after rebuilding the DB PoC"
            exit 1
          }
          state=$(gcloud database-migration migration-jobs describe "$MIGRATION_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(state)')
          phase=$(gcloud database-migration migration-jobs describe "$MIGRATION_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(phase)')
          read -r sql_type sql_state < <(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format='value(instanceType,state)')

          if [[ "$sql_type" == "READ_REPLICA_INSTANCE" && "$sql_state" == "RUNNABLE" ]]; then
            [[ "$phase" == "CDC" ]] || { echo "Destination never reached CDC"; exit 1; }
            if [[ "$MODE" == "data-preflight" && "$state" != "RUNNING" ]]; then
              echo "Routine readiness requires DMS RUNNING/CDC"
              exit 1
            fi
            if [[ "$MODE" == "failover" && "$state" != "RUNNING" ]]; then
              echo "::warning::DMS is $state; only the last data already replicated to GCP is available"
            fi
          elif [[ "$MODE" == "failover" && "$sql_type" != "READ_REPLICA_INSTANCE" && "$sql_state" == "RUNNABLE" && "$state" == "COMPLETED" ]]; then
            echo "::warning::Destination is already promoted; resuming an interrupted approved failover"
          else
            echo "Cloud SQL/DMS combination is not safe for this operation: $sql_type / $sql_state / $state / $phase"
            exit 1
          fi
          {
            echo "### GCP data preflight"
            echo "- DMS: $state / $phase"
            echo "- Cloud SQL: $sql_type / $sql_state"
          } >> "$GITHUB_STEP_SUMMARY"

  approved-failover:
    name: Approved DB promotion and GKE activation
    if: inputs.mode == 'failover'
    needs: data-preflight
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment == 'phase1' && 'gcp-dr-approval' || format('{0}-gcp-dr-approval', inputs.deployment) }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DR_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Promote Cloud SQL destination to writer
        run: |
          set -Eeuo pipefail
          read -r sql_type sql_state < <(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" \
            --project "$GCP_PROJECT_ID" --format='value(instanceType,state)')
          if [[ "$sql_type" != "READ_REPLICA_INSTANCE" && "$sql_state" == "RUNNABLE" ]]; then
            echo "Cloud SQL is already a writer; skipping duplicate promotion"
            exit 0
          fi

          gcloud database-migration migration-jobs promote "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
          for attempt in {1..30}; do
            read -r sql_type sql_state < <(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format='value(instanceType,state)')
            if [[ "$sql_type" != "READ_REPLICA_INSTANCE" && "$sql_state" == "RUNNABLE" ]]; then
              exit 0
            fi
            sleep 20
          done
          echo "Cloud SQL promotion did not become ready within 10 minutes"
          exit 1

      - name: Enable point-in-time recovery after promotion
        run: |
          set -Eeuo pipefail
          gcloud sql instances patch "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" \
            --enable-point-in-time-recovery --quiet

      - name: Restore application roles and grants inside GKE
        shell: bash
        run: |
          set -Eeuo pipefail
          app_json=$(gcloud secrets versions access latest --secret "$GCP_SECRET_PREFIX-app-db" \
            --project "$GCP_PROJECT_ID")
          accounts_password=$(jq -r '.accounts_password' <<<"$app_json")
          ledger_password=$(jq -r '.ledger_password' <<<"$app_json")
          postgres_password=$(gcloud secrets versions access latest \
            --secret "$GCP_SECRET_PREFIX-cloudsql-admin" --project "$GCP_PROJECT_ID")
          cloudsql_ip=$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" \
            --project "$GCP_PROJECT_ID" --format=json | \
            jq -r '.ipAddresses[] | select(.type == "PRIVATE") | .ipAddress')
          echo "::add-mask::$accounts_password"
          echo "::add-mask::$ledger_password"
          echo "::add-mask::$postgres_password"
          [[ -n "$cloudsql_ip" ]] || { echo "Cloud SQL private IP is empty"; exit 1; }

          kubectl create namespace bank-db-admin --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          kubectl -n bank-db-admin create secret generic cloudsql-bootstrap \
            --from-literal=PGHOST="$cloudsql_ip" --from-literal=PGPORT=5432 \
            --from-literal=PGUSER=postgres --from-literal=PGPASSWORD="$postgres_password" \
            --from-literal=PGSSLMODE=require \
            --from-literal=ACCOUNTS_PASSWORD="$accounts_password" \
            --from-literal=LEDGER_PASSWORD="$ledger_password" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          trap 'kubectl -n bank-db-admin delete secret cloudsql-bootstrap --ignore-not-found >/dev/null || true' EXIT
          kubectl -n bank-db-admin create configmap bank-cloudsql-bootstrap-sql \
            --from-file=database/bootstrap/03-cloudsql-app-roles.sql \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          kubectl -n bank-db-admin delete job bank-cloudsql-bootstrap --ignore-not-found --wait=true >/dev/null
          kubectl apply -f database/kubernetes/bootstrap-cloudsql.yaml >/dev/null
          if ! kubectl -n bank-db-admin wait job/bank-cloudsql-bootstrap \
            --for=condition=Complete --timeout=10m; then
            kubectl -n bank-db-admin describe job bank-cloudsql-bootstrap || true
            kubectl -n bank-db-admin logs job/bank-cloudsql-bootstrap || true
            exit 1
          fi
          kubectl -n bank-db-admin logs job/bank-cloudsql-bootstrap
          kubectl -n bank-db-admin delete secret cloudsql-bootstrap >/dev/null
          trap - EXIT

      - name: Expand pilot-light GKE capacity
        run: |
          gcloud container clusters resize "$GKE_CLUSTER" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --node-pool "$GKE_NODE_POOL" --num-nodes "$GKE_FAILOVER_NODES" --quiet

      - name: Activate immutable GAR images in the GCP overlay
        env:
          TAG: ${{ inputs.image_tag }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin main
          python scripts/activate-gcp-dr.py --file gitops/apps/bank-of-anthos/overlays/gcp-dr/kustomization.yaml --tag "$TAG" --replicas 1
          git config user.name "dr-failover-bot"
          git config user.email "dr-failover-bot@users.noreply.github.com"
          git add gitops/apps/bank-of-anthos/overlays/gcp-dr/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "dr: activate GCP for ${INCIDENT_ID} with ${TAG}"
            scripts/open-auto-merge-pr.sh \
              "dr/failover-${TAG}" \
              "dr: activate GCP for ${INCIDENT_ID} with ${TAG}" \
              "Approved DR activation. Incident ID: ${INCIDENT_ID}; immutable tag: ${TAG}."
          else
            echo "GCP overlay already contains the approved tag and replica count"
          fi

      - name: Reconcile and smoke test
        run: |
          kubectl apply -f gitops/bootstrap/bank-of-anthos-gcp-dr.yaml
          kubectl -n bank-dr rollout status deployment/frontend --timeout=15m
          kubectl -n bank-dr get pods,ingress

  traffic-cutover-checkpoint:
    name: Approve traffic cutover after smoke test
    if: inputs.mode == 'failover'
    needs: approved-failover
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment == 'phase1' && 'gcp-traffic-cutover' || format('{0}-gcp-traffic-cutover', inputs.deployment) }}
    steps:
      - run: echo "Smoke test passed. DNS stays unchanged until separate authoritative-DNS approval."
