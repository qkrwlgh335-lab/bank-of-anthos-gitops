apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-of-anthos-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/qkrwlgh335-lab/bank-of-anthos-gitops.git
    targetRevision: main
    path: gitops/apps/bank-of-anthos/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
