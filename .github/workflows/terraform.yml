name: Terraform plan and apply

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: Terraform root to operate
        required: true
        type: choice
        options:
          - aws-infra
          - aws-addons
          - gcp-dr
          - gcp-addons
      action:
        description: Plan or apply
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  static-checks:
    name: Format and validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [aws-infra, aws-addons, gcp-cicd, gcp-dr, gcp-addons]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform -chdir=terraform/${{ matrix.stack }} fmt -check -recursive
      - name: Initialize without remote state
        run: terraform -chdir=terraform/${{ matrix.stack }} init -backend=false
      - name: Validate
        run: terraform -chdir=terraform/${{ matrix.stack }} validate

  plan:
    name: ${{ inputs.stack }} / plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials through GitHub OIDC
        if: startsWith(inputs.stack, 'aws-')
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud through WIF
        if: startsWith(inputs.stack, 'gcp-')
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Initialize selected stack
        run: terraform -chdir=terraform/${{ inputs.stack }} init -backend-config=backend.hcl.example

      - name: Plan
        run: terraform -chdir=terraform/${{ inputs.stack }} plan

  apply:
    name: ${{ inputs.stack }} / approved apply
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: static-checks
    runs-on: ubuntu-latest
    environment: infrastructure-production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials through GitHub OIDC
        if: startsWith(inputs.stack, 'aws-')
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud through WIF
        if: startsWith(inputs.stack, 'gcp-')
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Initialize selected stack
        run: terraform -chdir=terraform/${{ inputs.stack }} init -backend-config=backend.hcl.example

      - name: Create reviewed plan
        run: terraform -chdir=terraform/${{ inputs.stack }} plan -out=tfplan

      - name: Apply reviewed plan
        run: terraform -chdir=terraform/${{ inputs.stack }} apply -auto-approve tfplan

  terraform-required-gate:
    name: Terraform required gate
    if: always()
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate all Terraform roots
        env:
          STATIC_CHECK_RESULT: ${{ needs.static-checks.result }}
        run: |
          [[ "$STATIC_CHECK_RESULT" == "success" ]] || { echo "Terraform format or validation failed"; exit 1; }
          echo "Terraform required gate passed"
