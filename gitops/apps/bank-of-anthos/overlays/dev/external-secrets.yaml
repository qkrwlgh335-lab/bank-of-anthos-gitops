apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-app-runtime
  namespace: bank
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: bank-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: ACCOUNTS_DB_URI
      remoteRef:
        key: phase1/bank-app/runtime
        property: ACCOUNTS_DB_URI
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: phase1/bank-app/runtime
        property: SPRING_DATASOURCE_URL
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: phase1/bank-app/runtime
        property: SPRING_DATASOURCE_USERNAME
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: phase1/bank-app/runtime
        property: SPRING_DATASOURCE_PASSWORD
    - secretKey: REDIS_URL
      remoteRef:
        key: phase1/bank-app/runtime
        property: REDIS_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-app-jwt
  namespace: bank
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: jwt-key
    creationPolicy: Owner
  data:
    - secretKey: jwtRS256.key
      remoteRef:
        key: phase1/bank-app/jwt
        property: jwtRS256.key
    - secretKey: jwtRS256.key.pub
      remoteRef:
        key: phase1/bank-app/jwt
        property: jwtRS256.key.pub
