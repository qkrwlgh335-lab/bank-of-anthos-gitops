apiVersion: v1
kind: Pod
metadata:
  name: dr-cdc-runner
  labels:
    app: dr-cdc-runner
spec:
  restartPolicy: Never
  containers:
    - name: postgres
      image: postgres:16.14-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
      envFrom:
        - secretRef:
            name: db-probe
      command: ["/bin/sh", "-ec"]
      args: ["sleep 3600"]
